services:
  - type: web
    name: plot-touch-grass
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: TABPFN_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"
